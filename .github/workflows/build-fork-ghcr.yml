name: Build fork GHCR image

on:
  push:
    branches:
      - deploy/show-hide-amounts
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: feature-show-hide-amounts

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solidtime
  IMAGE_TAG: ${{ github.event.inputs.tag || 'feature-show-hide-amounts' }}

jobs:
  build-arm64:
    name: Build linux/arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get build SHA
        id: build
        run: echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy production environment template
        run: |
          cp .env.production .env
          rm .env.production .env.ci .env.example

      - name: Stamp version and build
        run: |
          sed -i 's/APP_VERSION=0.0.0/APP_VERSION=0.0.0-pr-show-hide-amounts/g' .env
          sed -i 's/APP_BUILD=0/APP_BUILD=${{ steps.build.outputs.short_sha }}/g' .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql

      - name: Install Composer dependencies
        run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --ignore-platform-reqs --classmap-authoritative

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          build-args: |
            DOCKER_FILES_BASE_PATH=docker/prod/
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ steps.build.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
